# Settings shared by every scenario in this project.
host: https://api.sampleapis.com

# sampleapis.com is a free public service, so both modes are kept very small here.
modes:
  baseline:
    users: 1              # per scenario
    duration: 10s
    pacing: 1             # each user starts one iteration per second
  limit:
    start_users: 2        # across all scenarios, shared by weight
    step_users: 2
    max_users: 6
    step_duration: 5s
    pacing: 1
    stop_when:
      error_percent: 5
      p95_ms: 1500
