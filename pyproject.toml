[project]
name = "performancemonitor"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "jsonpath-ng>=1.10.0",
    "locust>=2.46.7",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
perfmon = "perfmon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perfmon"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
