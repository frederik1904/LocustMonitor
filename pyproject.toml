[project]
name = "performancemonitor"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "jsonpath-ng>=1.10.0",
    "locust>=2.46.7",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[project.scripts]
perfmon = "perfmon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perfmon"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["perfmon", "helpers"]

[tool.pyright]
include = ["perfmon"]
venvPath = "."
venv = ".venv"

[tool.ruff.lint.per-file-ignores]
# Tests hold YAML and JSON snippets as one-line strings.
"tests/*" = ["E501"]
